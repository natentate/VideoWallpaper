name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build and package
        run: ./scripts/build.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: VideoWallpaper-dmg
          path: build/VideoWallpaper.dmg
          if-no-files-found: error

      - name: Verify Shortcuts / Focus Filter metadata
        shell: bash
        run: |
          META="build/VideoWallpaper.app/Contents/Resources/Metadata.appintents"
          ls -la "$META"
          for intent in VideoWallpaperFocusFilter ActivateFocusWallpaperIntent DeactivateFocusWallpaperIntent SetVideoWallpaperIntent; do
            if grep -q "$intent" "$META/extract.actionsdata"; then echo "✓ $intent"; else echo "✗ $intent missing"; exit 1; fi
          done

      - name: Self-test (render, play, Focus, URL scheme, downloads)
        shell: bash
        timeout-minutes: 10
        env:
          VIDEOWALLPAPER_DATA_DIR: ${{ runner.temp }}/videowallpaper-selftest
        run: build/VideoWallpaper.app/Contents/MacOS/VideoWallpaper --self-test 2>&1

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/VideoWallpaper.dmg
          generate_release_notes: true
